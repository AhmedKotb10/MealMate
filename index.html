<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meal Mate – غداء الأسبوع</title>
<style>
:root{--bg:#faf6ef;--card:#fff;--tx:#2b2118;--mu:#7a6a5a;--ac:#d9622b;--ln:#eadfce;--ac2:#fbe6d9;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1812;--card:#2a231b;--tx:#f3e9dc;--mu:#b5a592;--ac:#f08a52;--ln:#3b3227;--ac2:#47301f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d1812;--card:#2a231b;--tx:#f3e9dc;--mu:#b5a592;--ac:#f08a52;--ln:#3b3227;--ac2:#47301f;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 12px}
nav{display:flex;gap:6px;margin-bottom:14px}
nav button{flex:1;padding:10px 4px;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:12px;font:inherit;cursor:pointer}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:14px;margin-bottom:10px}
.big{font-size:20px;font-weight:700;margin:0 0 4px}
.mu{color:var(--mu);font-size:14px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tg{background:var(--ac2);border-radius:99px;padding:2px 10px;font-size:13px;border:0;color:var(--tx);font-family:inherit}
button.tg{cursor:pointer;border:1px solid var(--ln);background:var(--card)}button.tg.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.pri{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:11px 16px;font:inherit;cursor:pointer;width:100%;margin-top:6px}
.sm{background:none;border:1px solid var(--ln);color:var(--mu);border-radius:10px;padding:4px 10px;font:inherit;font-size:13px;cursor:pointer}
.sm.red{color:#c0392b;border-color:#c0392b}
input,select{width:100%;padding:10px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;margin:4px 0 8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.day{color:var(--ac);font-weight:700;font-size:14px}
#st{text-align:center;color:var(--mu);padding:20px}
</style>
</head>
<body>
<main>
<h1>🍽️ Meal Mate</h1><p class="mu" style="margin-top:-8px">هنأكل ايه النهارده؟</p>
<nav><button data-v="today" class="on">النهارده</button><button data-v="week">الأسبوع</button><button data-v="all">الوجبات</button></nav>
<div id="msg" class="mu" style="text-align:center;min-height:22px;margin-bottom:8px"></div>
<div id="app"></div>
</main>
<script>
const TAGS=["بومب","تخن","سريع","متوسط","وقت","جوسي","هيلثي","خفيفة","نادر","مصري","سمك","شتوي"];
const LBL={متوسط:"متوسط السرعة",وقت:"محتاج وقت",نادر:"تكرار قليل",بومب:"بومب 💨"};
const D=[["برجر","لحمة مفرومة + عيش + بطاطس",1,"جوسي سريع تخن"],["صينية لحمة + مكرونة حمرا + سلطة خس","لحمة + طماطم + مكرونة + خس",2,"متوسط"],["ملوخية + أرز + سلطة + فراخ","ملوخية + خضار سلطة + فراخ + أرز",1,"بومب سريع مصري"],["محشي كرنب + فراخ + سلطة خس","كرنب + خضرا + أرز + فراخ + خس",2,"بومب وقت مصري نادر"],["حواوشي + سلطة + طحينة","لحمة مفرومة + عيش بلدي + خضار سلطة",1,"تخن بومب جوسي"],["كشري","عدس + بصل + طماطم + أرز",2,"بومب تخن متوسط نادر"],["شوربة عدس + عيش محمص","عدس + جزر + بطاطس",1,"سريع بومب شتوي نادر"],["مكرونة بشاميل + سلطة خس","لبن + خس + جبنة + مكرونة",2,"تخن سريع"],["سلطة كينوا + فراخ + شوربة","فراخ + بنجر + أفوكادو + رمان + خس + خضرا",1,"خفيفة هيلثي سريع"],["كسادياز فراخ + بطاطس + سلطة","تورتيا + فراخ + فلفل + بطاطس + جبنة",1,"تخن سريع"],["فريك + لحمة + خضار سوتيه","فريك + لحمة + خضار",2,"متوسط هيلثي"],["سمك مشوي + أرز سمك + سلطة + طحينة","سمك + خضار سلطة + أرز",1,"متوسط بومب سمك"],["طاجن جمبري وسمك + أرز سمك","جمبري + سمك + أرز + فلفل",1,"سريع سمك"],["محشي فلفل + لحمة + سلطة","فلفل + أرز + خضرا + لحمة + بصل",2,"وقت تخن مصري نادر"],["نجريسكو + سلطة","مشروم + فراخ + لبن + جبنة + خضار سلطة",2,"تخن وقت"],["حندوقية + مكرونة","فراخ + فلفل + طماطم + مكرونة",1,"سريع جوسي"],["أرز + بامية + سلطة فلفل","بامية + فلفل + ليمون + طماطم + لحمة + أرز",2,"بومب متوسط مصري"],["أرز + بسلة","بسلة + أرز + طماطم + لحمة",2,"متوسط تخن مصري"],["صينية بطاطس باللحمة","بطاطس + طماطم + لحمة",2,"تخن وقت"],["مكرونة حمرا + استربس + سلطة","استربس + طماطم + خضار سلطة + مكرونة",1,"سريع"],["فتة + أرز + لحمة","عيش بلدي + لحمة + طماطم + أرز",2,"تخن وقت مصري"],["سندوتشات فرايد تشيكن","كايزر + فراخ + بطاطس",1,"سريع جوسي"]];let col=null,meals=[],db=null,canW=true,view="today",sel=new Set(),cur=null,plan=null,loaded=false,delId=null;
const $=s=>document.querySelector(s);
const note=t=>{const m=$("#msg");if(m)m.textContent=t};const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const has=(m,t)=>m.t.includes(t);
const ings=m=>m.i.split(/\s*[+،]\s*/).filter(Boolean);
const tagsH=m=>`<div class="tags">${m.t.map(t=>`<span class="tg">${esc(LBL[t]||t)}</span>`).join("")}</div>`;
const norm=(id,o)=>({id,n:String(o.n||"").slice(0,80),i:String(o.i||"").slice(0,200),d:o.d==1?1:2,t:Array.isArray(o.t)?o.t.filter(x=>TAGS.includes(x)):[]});

function pickToday(){
  let pool=meals.filter(m=>[...sel].every(t=>has(m,t)));
  const common=pool.filter(m=>!has(m,"نادر"));
  if(common.length&&(Math.random()>.12||!pool.length))pool=common;
  const o=pool.filter(m=>m!==cur);
  cur=(o.length?o:pool)[Math.floor(Math.random()*(o.length||pool.length))]||null;
}
function score(pl){let s=0,b=0,f=0,r=0,h=0,w=0,q=0;
  pl.forEach((m,i)=>{
    if(has(m,"بومب")){b++;if(i&&has(pl[i-1],"بومب"))s-=100}
    if(has(m,"سمك"))f++;if(has(m,"نادر"))r++;if(has(m,"تخن"))h+=m.d;if(has(m,"وقت"))w++;if(has(m,"سريع"))q+=m.d;
    if(i){const a=new Set(ings(pl[i-1]));s-=4*ings(m).filter(x=>a.has(x)).length}
    if(i&&has(m,"تخن")&&has(pl[i-1],"تخن"))s-=3;
  });
  if(b>2)s-=100*(b-2);if(f>1)s-=100*(f-1);if(r>1)s-=60;if(r)s-=8;
  if(h>4)s-=25*(h-4);if(w>1)s-=30*(w-1);if(q<2)s-=20;
  return s+Math.random();
}
function genPlan(){
  let best=null,bs=-1e9;
  for(let k=0;k<400;k++){
    let left=7,pl=[];
    for(const m of meals.slice().sort(()=>Math.random()-.5)){
      if(left<=0)break;if(m.d>left)continue;pl.push(m);left-=m.d;
    }
    const s=score(pl)-left*50;
    if(s>bs){bs=s;best=pl}
  }
  plan=best;
}
const dayName=i=>new Date(Date.now()+i*864e5).toLocaleDateString("ar-EG",{weekday:"long"});

function render(){
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===view));
  const a=$("#app");
  if(!loaded){a.innerHTML='<div id="st">بحمّل الوجبات…</div>';return}
  if(!db){a.innerHTML='<div id="st">لازم تفتح الصفحة وانت مسجّل دخول عشان الوجبات المشتركة تظهر.</div>';return}
  if(view==="today"){
    if(!meals.length){a.innerHTML='<div id="st">مفيش وجبات لسه. ضيف أول وجبة من تبويب «الوجبات».</div>';return}
    if(!cur||!meals.includes(cur))pickToday();
    a.innerHTML=`<div class="tags" style="margin:0 0 10px">${TAGS.map(t=>`<button class="tg${sel.has(t)?" on":""}" data-f="${t}">${esc(LBL[t]||t)}</button>`).join("")}</div>`+
    (cur?`<div class="card"><p class="big">${esc(cur.n)}</p><div class="mu">${esc(cur.i)}</div><div class="mu">تكفي ${cur.d==1?"يوم":"يومين"}</div>${tagsH(cur)}</div>`:'<div id="st">مفيش وجبة بالفلاتر دي.</div>')+
    '<button class="pri" id="again">🎲 اقترح حاجة تانية</button>';
  }else if(view==="week"){
    if(!plan||plan.some(m=>!meals.includes(m)))genPlan();
    let d=0;
    a.innerHTML=(plan||[]).map(m=>{const x=dayName(d),y=m.d==2?" + "+dayName(d+1):"";d+=m.d;
      return `<div class="card"><div class="day">${esc(x+y)}</div><p class="big">${esc(m.n)}</p><div class="mu">${esc(m.i)}</div>${tagsH(m)}</div>`}).join("")+
    '<button class="pri" id="regen">🔄 خطة تانية</button>';
    if(!plan||!plan.length)a.innerHTML='<div id="st">محتاج وجبات أكتر عشان أعمل خطة.</div>';
  }else{
    a.innerHTML=(canW?`<div class="card"><b>➕ ضيف وجبة</b>
      <input id="fn" placeholder="اسم الوجبة" maxlength="80"><input id="fi" placeholder="المكونات (افصل بينها بـ +)" maxlength="200">
      <select id="fd"><option value="1">تكفي يوم</option><option value="2">تكفي يومين</option></select>
      <div class="tags" style="margin:0 0 8px">${TAGS.map(t=>`<button class="tg" data-nt="${t}">${esc(LBL[t]||t)}</button>`).join("")}</div>
      <button class="pri" id="add">حفظ</button></div>`:"")+
    `<p class="mu">${meals.length} وجبة</p>`+meals.map(m=>`<div class="card"><div class="row"><p class="big" style="font-size:17px">${esc(m.n)}</p>${canW?`<button class="sm red" data-del="${esc(m.id)}">${delId===m.id?"تأكيد الحذف؟":"حذف"}</button>`:""}</div><div class="mu">${esc(m.i)} · ${m.d==1?"يوم":"يومين"}</div>${tagsH(m)}</div>`).join("");
  }
}
document.addEventListener("click",async e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.v){view=b.dataset.v;render();return}
  if(b.dataset.f){sel.has(b.dataset.f)?sel.delete(b.dataset.f):sel.add(b.dataset.f);cur=null;render();return}
  if(b.id==="again"){pickToday();render();return}
  if(b.id==="regen"){plan=null;render();return}
  if(b.dataset.nt){b.classList.toggle("on");return}
  if(b.id==="add"){
    const n=$("#fn").value.trim(),i=$("#fi").value.trim();if(!n)return;
    const t=[...document.querySelectorAll("[data-nt].on")].map(x=>x.dataset.nt);
    b.disabled=true;
    try{await col.doc("m"+Date.now().toString(36)).set({n,i,d:+$("#fd").value,t});plan=null;note("اتحفظت ✓")}catch(e){note("معرفتش أحفظ: "+(e&&(e.code||e.message)||"خطأ"))}
    b.disabled=false;return}
  if(b.dataset.del){
    if(delId!==b.dataset.del){delId=b.dataset.del;render();return}
    try{await col.doc(delId).delete();plan=null;note("اتحذفت ✓")}catch(e){note("معرفتش أحذف: "+(e&&(e.code||e.message)||"خطأ"))}
    delId=null;return}
});
function localCol(){
  let L=null;try{L=JSON.parse(localStorage.getItem("mm")||"null")}catch(_){}
  if(!L){L={_s:{v:1}};D.forEach((x,k)=>L["m"+String(k+1).padStart(2,"0")]={n:x[0],i:x[1],d:x[2],t:x[3].split(" ")})}
  const save=()=>{try{localStorage.setItem("mm",JSON.stringify(L));if(!localStorage.getItem("mm"))throw 0}catch(_){if(!window.w1){window.w1=1;note("المتصفح ده مش بيحفظ التعديلات. افتح اللينك من Chrome أو Safari أو سجّل دخول على claude.ai.")}}};let cb=()=>{};
  const fire=()=>cb({docs:Object.entries(L).map(([id,v])=>({id,data:()=>v}))});
  return{onSnapshot(f){cb=f;fire()},doc:id=>({set:async v=>{L[id]=v;save();fire()},delete:async()=>{delete L[id];save();fire()}})}
}
setTimeout(()=>{if(!loaded){loaded=true;render()}},10000);
(async()=>{
  try{
    let u=null;try{u=await claude.use("user");db=await claude.use("db");if(db&&u)col=db.collection("data/users/"+await u.id())}catch(_){}
    if(!col){db=1;col=localCol();note("⚠️ التعديلات بتتحفظ في المتصفح ده بس")}else note("✓ التعديلات بتتحفظ على حسابك")
    if(col)col.onSnapshot(s=>{
      if(!s.docs.some(d=>d.id==="_s")){if(s.metadata&&s.metadata.fromCache)return;D.forEach((x,k)=>col.doc("m"+String(k+1).padStart(2,"0")).set({n:x[0],i:x[1],d:x[2],t:x[3].split(" ")}));col.doc("_s").set({v:1});return}
      meals=s.docs.filter(d=>d.id!=="_s").map(d=>norm(d.id,d.data())).filter(m=>m.n).sort((a,b)=>a.id.localeCompare(b.id,undefined,{numeric:true}));
      loaded=true;cur=null;if(!document.activeElement||document.activeElement.tagName!=="INPUT")render()},()=>{loaded=true;render()});
  }catch(_){}
  loaded=true;render();
})();
render();
</script>
</body>
</html>
