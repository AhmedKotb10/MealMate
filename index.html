<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meal Mate – غداء الأسبوع</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6f7;--card:#fff;--tx:#17212b;--mu:#667585;--ac:#0f766e;--ac2:#e3f1ee;--ln:#e2e7eb;--on:#fff;--red:#b42318;--sh:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1417;--card:#161e23;--tx:#e6ecef;--mu:#8fa0ab;--ac:#4fc3b0;--ac2:#1a2f2f;--ln:#243039;--on:#06211d;--red:#f1877e;--sh:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1417;--card:#161e23;--tx:#e6ecef;--mu:#8fa0ab;--ac:#4fc3b0;--ac2:#1a2f2f;--ln:#243039;--on:#06211d;--red:#f1877e;--sh:none;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 Cairo,system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
main{max-width:640px;margin:0 auto;padding:18px 16px 32px}
h1{font-size:22px;font-weight:700;margin:4px 0 14px;letter-spacing:-.2px}
nav{display:flex;gap:4px;margin-bottom:14px;background:var(--ln);padding:4px;border-radius:14px}
nav button{flex:1;padding:9px 4px;border:0;background:transparent;color:var(--mu);border-radius:11px;font:inherit;font-weight:600;cursor:pointer;transition:background .15s,color .15s}
nav button.on{background:var(--card);color:var(--ac);box-shadow:var(--sh)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.big{font-size:18px;font-weight:700;margin:0 0 4px;line-height:1.4}
.mu{color:var(--mu);font-size:14px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tg{background:var(--ac2);color:var(--ac);border-radius:99px;padding:2px 11px;font-size:13px;font-weight:600;border:0;font-family:inherit}
button.tg{cursor:pointer;border:1px solid var(--ln);background:var(--card);color:var(--mu)}button.tg.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
.pri{background:var(--ac);color:var(--on);border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:700;cursor:pointer;width:100%;margin-top:6px}
.pri:hover{opacity:.92}.pri:disabled{opacity:.5}
.sm{background:var(--card);border:1px solid var(--ln);color:var(--mu);border-radius:10px;padding:4px 11px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.sm:hover{border-color:var(--ac);color:var(--ac)}
.sm.red{color:var(--red);border-color:var(--red)}.sm.red:hover{background:var(--red);color:var(--on)}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--ln);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit;margin:4px 0 8px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:1px;border-color:transparent}
textarea{direction:ltr;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;resize:vertical}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.row>p{flex:1;min-width:0;overflow-wrap:anywhere;margin:0}.row>span,.row>button{flex-shrink:0;white-space:nowrap}
.day{color:var(--ac);font-weight:700;font-size:14px}
#st{text-align:center;color:var(--mu);padding:24px}
</style>
</head>
<body>
<main>
<h1>🍽️ Meal Mate</h1><p class="mu" style="margin-top:-8px">هنأكل ايه النهارده؟</p>
<nav><button data-v="today" class="on">النهارده</button><button data-v="week">الأسبوع</button><button data-v="all">الوجبات</button></nav>
<div id="msg" class="mu" style="text-align:center;min-height:22px;margin-bottom:8px"></div>
<div id="app"></div>
</main>
<script>
const TAGS=["بومب","تخن","سريع","متوسط","وقت","جوسي","هيلثي","خفيفة","نادر","مصري","سمك","شتوي"];
const LBL={متوسط:"متوسط السرعة",وقت:"محتاج وقت",نادر:"تكرار قليل",بومب:"بومب 💨"};
const D=[["برجر","لحمة مفرومة + عيش + بطاطس",1,"جوسي سريع تخن"],["صينية لحمة + مكرونة حمرا + سلطة خس","لحمة + طماطم + مكرونة + خس",2,"متوسط"],["ملوخية + أرز + سلطة + فراخ","ملوخية + خضار سلطة + فراخ + أرز",1,"بومب سريع مصري"],["محشي كرنب + فراخ + سلطة خس","كرنب + خضرا + أرز + فراخ + خس",2,"بومب وقت مصري نادر"],["حواوشي + سلطة + طحينة","لحمة مفرومة + عيش بلدي + خضار سلطة",1,"تخن بومب جوسي"],["كشري","عدس + بصل + طماطم + أرز",2,"بومب تخن متوسط نادر"],["شوربة عدس + عيش محمص","عدس + جزر + بطاطس",1,"سريع بومب شتوي نادر"],["مكرونة بشاميل + سلطة خس","لبن + خس + جبنة + مكرونة",2,"تخن سريع"],["سلطة كينوا + فراخ + شوربة","فراخ + بنجر + أفوكادو + رمان + خس + خضرا",1,"خفيفة هيلثي سريع"],["كسادياز فراخ + بطاطس + سلطة","تورتيا + فراخ + فلفل + بطاطس + جبنة",1,"تخن سريع"],["فريك + لحمة + خضار سوتيه","فريك + لحمة + خضار",2,"متوسط هيلثي"],["سمك مشوي + أرز سمك + سلطة + طحينة","سمك + خضار سلطة + أرز",1,"متوسط بومب سمك"],["طاجن جمبري وسمك + أرز سمك","جمبري + سمك + أرز + فلفل",1,"سريع سمك"],["محشي فلفل + لحمة + سلطة","فلفل + أرز + خضرا + لحمة + بصل",2,"وقت تخن مصري نادر"],["نجريسكو + سلطة","مشروم + فراخ + لبن + جبنة + خضار سلطة",2,"تخن وقت"],["حندوقية + مكرونة","فراخ + فلفل + طماطم + مكرونة",1,"سريع جوسي"],["أرز + بامية + سلطة فلفل","بامية + فلفل + ليمون + طماطم + لحمة + أرز",2,"بومب متوسط مصري"],["أرز + بسلة","بسلة + أرز + طماطم + لحمة",2,"متوسط تخن مصري"],["صينية بطاطس باللحمة","بطاطس + طماطم + لحمة",2,"تخن وقت"],["مكرونة حمرا + استربس + سلطة","استربس + طماطم + خضار سلطة + مكرونة",1,"سريع"],["فتة + أرز + لحمة","عيش بلدي + لحمة + طماطم + أرز",2,"تخن وقت مصري"],["سندوتشات فرايد تشيكن","كايزر + فراخ + بطاطس",1,"سريع جوسي"]];let editId=null,pick=null,col=null,meals=[],db=null,canW=true,view="today",sel=new Set(),cur=null,plan=null,loaded=false,delId=null;
const $=s=>document.querySelector(s);
const note=t=>{const m=$("#msg");if(m)m.textContent=t};const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const has=(m,t)=>m.t.includes(t);
const ings=m=>m.i.split(/\s*[+،]\s*/).filter(Boolean);
const KD=[["🥩 لحمة",/لحم|حواوشي|برجر|كفت|كبد|سجق|ستيك|مفروم|كباب|ضاني/],["🍗 فراخ",/فراخ|دجاج|ستربس|استربس|تشيكن/],["🐟 سمك",/سمك|جمبري|بلطي|ماكريل|تونة/]];
const kd=(m,i)=>KD[i][1].test(m.n+" "+m.i);const kinds=m=>KD.filter((_,i)=>kd(m,i)).map(k=>k[0]);
const dayB=m=>`<div style="margin-top:8px"><span class="tg" style="border:1px solid var(--ac);background:none;color:var(--ac);font-weight:700">تكفي ${m.d==1?"يوم":"يومين"}</span></div>`;
const tagsH=(m,sd)=>`<div class="tags">${kinds(m).map(k=>`<span class="tg" style="background:var(--ac);color:var(--on)">${k}</span>`).join("")}${m.t.filter(t=>t!=="سمك").map(t=>`<span class="tg">${esc(LBL[t]||t)}</span>`).join("")}</div>`;
const allTags=()=>[...new Set([...TAGS,...meals.flatMap(m=>m.t)])];
const getTags=()=>[...new Set([...document.querySelectorAll("[data-nt].on")].map(x=>x.dataset.nt).concat(($("#fl").value||"").split(/[,،]/).map(x=>x.trim().slice(0,20)).filter(Boolean)))];
function formH(m){const e=!!m,t=e?m.t:[];return `<div class="card"><b>${e?"✏️ تعديل الوجبة":"➕ ضيف وجبة"}</b>
      <input id="fn" placeholder="اسم الوجبة" maxlength="80" value="${esc(e?m.n:"")}"><input id="fi" placeholder="المكونات (افصل بينها بـ +)" maxlength="200" value="${esc(e?m.i:"")}">
      <select id="fd"><option value="1"${e&&m.d==1?" selected":""}>تكفي يوم</option><option value="2"${e&&m.d!=1?" selected":""}>تكفي يومين</option></select>
      <div class="tags" style="margin:0 0 8px">${allTags().map(x=>`<button class="tg${t.includes(x)?" on":""}" data-nt="${esc(x)}">${esc(LBL[x]||x)}</button>`).join("")}</div>
      <input id="fl" placeholder="label جديد (افصل بينهم بفاصلة)" maxlength="60">
      <button class="pri" id="${e?"save":"add"}">${e?"حفظ التعديل":"حفظ"}</button>${e?`<button class="sm" id="cancel" style="width:100%;margin-top:6px">إلغاء</button>`:""}</div>`}
let xfer=null,showTx=false;const exp=()=>JSON.stringify(meals.map(m=>({n:m.n,i:m.i,d:m.d,t:m.t})));
function xferH(){const bt=`<div class="row" style="margin-bottom:12px"><button class="sm" data-x="ex" style="flex:1;padding:8px">تصدير الوجبات</button><button class="sm" data-x="im" style="flex:1;padding:8px">استيراد وجبات</button></div>`;
  if(xfer==="ex")return bt+`<div class="card"><b>تصدير</b><p class="mu">دوس «نسخ الوجبات» والصقها في ملاحظات أو رسالة لنفسك، أو نزّلها كملف. وبعدين افتح أي نسخة تانية من الصفحة واستوردها.</p>${showTx?`<textarea id="xo" readonly rows="6">${esc(exp())}</textarea>`:""}<button class="pri" id="cpy">نسخ الوجبات</button><button class="sm" id="dl" style="width:100%;margin-top:8px;padding:8px">تنزيل كملف</button></div>`;
  if(xfer==="im")return bt+`<div class="card"><b>استيراد</b><p class="mu">الصق النص اللي صدّرته هنا، أو اختار الملف. الوجبات اللي بنفس الاسم مش هتتكرر.</p><input type="file" id="impf" accept=".json,.txt,application/json"><textarea id="imp" rows="6" placeholder="الصق هنا"></textarea><button class="pri" id="doimp">استيراد</button></div>`;
  return bt}
const norm=(id,o)=>({id,n:String(o.n||"").slice(0,80),i:String(o.i||"").slice(0,200),d:o.d==1?1:2,t:Array.isArray(o.t)?o.t.map(x=>String(x).trim().slice(0,20)).filter(Boolean).slice(0,15):[]});

function pickToday(){
  let pool=meals.filter(m=>[...sel].every(t=>has(m,t)));
  const common=pool.filter(m=>!has(m,"نادر"));
  if(common.length&&(Math.random()>.12||!pool.length))pool=common;
  const o=pool.filter(m=>m!==cur);
  cur=(o.length?o:pool)[Math.floor(Math.random()*(o.length||pool.length))]||null;
}
function score(pl){let s=0,b=0,f=0,r=0,h=0,w=0,q=0,mt=0,ck=0;
  pl.forEach((m,i)=>{
    if(has(m,"بومب")){b++;if(i&&has(pl[i-1],"بومب"))s-=100}
    if(kd(m,0))mt+=m.d;if(kd(m,1))ck+=m.d;if(has(m,"سمك")||kd(m,2))f++;if(has(m,"نادر"))r++;if(has(m,"تخن"))h+=m.d;if(has(m,"وقت"))w++;if(has(m,"سريع"))q+=m.d;
    if(i){const a=new Set(ings(pl[i-1]));s-=4*ings(m).filter(x=>a.has(x)).length}
    if(i&&has(m,"تخن")&&has(pl[i-1],"تخن"))s-=3;
  });
  if(mt>3)s-=100*(mt-3);if(ck>3)s-=100*(ck-3);if(b>2)s-=100*(b-2);if(f>1)s-=100*(f-1);if(r>1)s-=60;if(r)s-=8;
  if(h>4)s-=25*(h-4);if(w>1)s-=30*(w-1);if(q<2)s-=20;
  return s+Math.random();
}
function genPlan(){
  let best=null,bs=-1e9;
  for(let k=0;k<400;k++){
    let left=7,pl=[];
    for(const m of meals.slice().sort(()=>Math.random()-.5)){
      if(left<=0)break;if(m.d>left)continue;pl.push(m);left-=m.d;
    }
    const s=score(pl)-left*50;
    if(s>bs){bs=s;best=pl}
  }
  plan=best;
}
const dayName=i=>new Date(Date.now()+i*864e5).toLocaleDateString("ar-EG",{weekday:"long"});

function render(){
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===view));
  const a=$("#app");
  if(!loaded){a.innerHTML='<div id="st">بحمّل الوجبات…</div>';return}
  if(!db){a.innerHTML='<div id="st">لازم تفتح الصفحة وانت مسجّل دخول عشان الوجبات المشتركة تظهر.</div>';return}
  if(view==="today"){
    if(!meals.length){a.innerHTML='<div id="st">مفيش وجبات لسه. ضيف أول وجبة من تبويب «الوجبات».</div>';return}
    if(!cur||!meals.includes(cur))pickToday();
    a.innerHTML=`<div class="tags" style="margin:0 0 10px">${allTags().map(t=>`<button class="tg${sel.has(t)?" on":""}" data-f="${esc(t)}">${esc(LBL[t]||t)}</button>`).join("")}</div>`+
    (cur?`<div class="card"><p class="big">${esc(cur.n)}</p><div class="mu">${esc(cur.i)}</div>${dayB(cur)}${tagsH(cur)}</div>`:'<div id="st">مفيش وجبة بالفلاتر دي.</div>')+
    '<button class="pri" id="again">🎲 اقترح حاجة تانية</button>';
  }else if(view==="week"){
    if(!plan||plan.some(m=>!meals.includes(m)))genPlan();
    let d=0;
    a.innerHTML=(plan||[]).map((m,k)=>{const x=dayName(d),y=m.d==2?" + "+dayName(d+1):"";d+=m.d;
      return `<div class="card"><div class="row"><div class="day">${esc(x+y)}</div><span><button class="sm" data-sw="${k}">🔄 غيّر</button> <button class="sm" data-pick="${k}">📋 اختار</button></span></div><p class="big">${esc(m.n)}</p><div class="mu">${esc(m.i)}</div>${tagsH(m)}${pick===k?pickH(k):""}</div>`}).join("")+
    '<button class="pri" id="regen">🔄 خطة تانية</button>';
    if(!plan||!plan.length)a.innerHTML='<div id="st">محتاج وجبات أكتر عشان أعمل خطة.</div>';
  }else{
    a.innerHTML=(canW?formH(editId?meals.find(x=>x.id===editId):null):"")+
    xferH()+`<p class="mu">${meals.length} وجبة</p>`+meals.map(m=>`<div class="card"><div class="row"><p class="big" style="font-size:17px">${esc(m.n)}</p>${canW?`<span><button class="sm" data-ed="${esc(m.id)}">✏️ تعديل</button> <button class="sm red" data-del="${esc(m.id)}">${delId===m.id?"تأكيد الحذف؟":"حذف"}</button></span>`:""}</div><div class="mu">${esc(m.i)}</div>${dayB(m)}${tagsH(m)}</div>`).join("");
  }
}
document.addEventListener("click",async e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.v){view=b.dataset.v;editId=null;render();return}
  if(b.dataset.f){sel.has(b.dataset.f)?sel.delete(b.dataset.f):sel.add(b.dataset.f);cur=null;render();return}
  if(b.id==="again"){pickToday();render();return}
  if(b.dataset.pick){const k=+b.dataset.pick;pick=pick===k?null:k;render();return}
  if(b.dataset.sw){swap(+b.dataset.sw);return}
  if(b.id==="regen"){plan=null;pick=null;render();return}
  if(b.dataset.nt){b.classList.toggle("on");return}
  if(b.dataset.x){showTx=false;xfer=xfer===b.dataset.x?null:b.dataset.x;render();return}
  if(b.id==="cpy"){const tx=exp();let ok=false;
    try{await navigator.clipboard.writeText(tx);ok=true}catch(_){try{const t=document.createElement("textarea");t.value=tx;t.style.cssText="position:fixed;opacity:0";document.body.appendChild(t);t.select();ok=document.execCommand("copy");t.remove()}catch(__){}}
    if(ok)note("اتنسخت الوجبات ✓");else{showTx=true;render();note("النسخ التلقائي مش متاح هنا. انسخ النص يدوياً من الخانة.")}return}
  if(b.id==="dl"){try{const u=URL.createObjectURL(new Blob([exp()],{type:"application/json"})),a=document.createElement("a");a.href=u;a.download="meals.json";document.body.appendChild(a);a.click();a.remove();note("لو التنزيل ماحصلش، استخدم زرار نسخ الوجبات.")}catch(_){note("التنزيل مش متاح هنا، استخدم زرار نسخ الوجبات.")}return}
  if(b.id==="doimp"){let arr;try{arr=JSON.parse($("#imp").value)}catch(_){note("النص مش صالح. اتأكد إنك لصقته كامل.");return}
    if(!Array.isArray(arr)){note("الصيغة غلط.");return}
    const have=new Set(meals.map(m=>m.n.trim()));let c=0,k=0;b.disabled=true;
    try{for(const o of arr.slice(0,200)){const m=norm("",o||{});if(!m.n||have.has(m.n.trim())){k++;continue}have.add(m.n.trim());await col.doc("m"+Date.now().toString(36)+Math.random().toString(36).slice(2,5)).set({n:m.n,i:m.i,d:m.d,t:m.t});c++}plan=null;xfer=null;note("اتضافت "+c+" وجبة، وتخطّيت "+k+" (موجودة قبل كده).")}catch(e){note("معرفتش أستورد: "+(e&&(e.code||e.message)||"خطأ"))}
    b.disabled=false;render();return}
  if(b.dataset.ed){editId=b.dataset.ed;render();return}
  if(b.id==="cancel"){editId=null;render();return}
  if(b.id==="save"){const n=$("#fn").value.trim(),i=$("#fi").value.trim();if(!n)return;b.disabled=true;
    try{await col.doc(editId).set({n,i,d:+$("#fd").value,t:getTags()});plan=null;editId=null;note("اتعدّلت ✓")}catch(e){note("معرفتش أحفظ: "+(e&&(e.code||e.message)||"خطأ"))}
    b.disabled=false;render();return}
  if(b.id==="add"){
    const n=$("#fn").value.trim(),i=$("#fi").value.trim();if(!n)return;
    const t=getTags();
    b.disabled=true;
    try{await col.doc("m"+Date.now().toString(36)).set({n,i,d:+$("#fd").value,t});plan=null;note("اتحفظت ✓")}catch(e){note("معرفتش أحفظ: "+(e&&(e.code||e.message)||"خطأ"))}
    b.disabled=false;return}
  if(b.dataset.del){
    if(delId!==b.dataset.del){delId=b.dataset.del;render();return}
    try{await col.doc(delId).delete();plan=null;note("اتحذفت ✓")}catch(e){note("معرفتش أحذف: "+(e&&(e.code||e.message)||"خطأ"))}
    delId=null;return}
});
function pickH(k){return `<select data-pk="${k}"><option value="">اختار وجبة…</option>${meals.filter(x=>!plan.includes(x)).map(x=>`<option value="${esc(x.id)}">${esc(x.n)} (${x.d==1?"يوم":"يومين"})</option>`).join("")}</select>`}
function setMeal(k,m){const o=plan[k];
  if(m.d>o.d){const n=plan[k+1];if(!n||n.d!==1){note("الوجبة دي بتاخد يومين ومفيش يوم فاضي جنبها. اختار وجبة بيوم.");return}plan.splice(k,2,m)}
  else if(m.d<o.d){plan[k]=m;const c=meals.filter(x=>!plan.includes(x)&&x.d===1);
    if(c.length){const r=c.map(x=>{const p=plan.slice();p.splice(k+1,0,x);return[score(p),x]}).sort((a,b)=>b[0]-a[0])[0][1];plan.splice(k+1,0,r)}}
  else plan[k]=m;
  pick=null;render()}
document.addEventListener("change",e=>{if(e.target.id==="impf"){const f=e.target.files[0];if(f)f.text().then(t=>{$("#imp").value=t;note("اتقرا الملف. دوس استيراد.")});return}
  const s=e.target.closest("select[data-pk]");if(!s||!s.value)return;const m=meals.find(x=>x.id===s.value);if(m)setMeal(+s.dataset.pk,m)});
function swap(k){const cand=meals.filter(m=>!plan.includes(m)&&m.d===plan[k].d);
  if(!cand.length){note("مفيش بديل بنفس المدة. ضيف وجبات أكتر.");return}
  const r=cand.map(m=>{const p=plan.slice();p[k]=m;return[score(p),m]}).sort((a,b)=>b[0]-a[0]).slice(0,3);
  plan[k]=r[Math.floor(Math.random()*r.length)][1];pick=null;render()}
function localCol(){
  let L=null;try{L=JSON.parse(localStorage.getItem("mm")||"null")}catch(_){}
  if(!L){L={_s:{v:1}};D.forEach((x,k)=>L["m"+String(k+1).padStart(2,"0")]={n:x[0],i:x[1],d:x[2],t:x[3].split(" ")})}
  const save=()=>{try{localStorage.setItem("mm",JSON.stringify(L));if(!localStorage.getItem("mm"))throw 0}catch(_){if(!window.w1){window.w1=1;note("المتصفح ده مش بيحفظ التعديلات. افتح اللينك من Chrome أو Safari أو سجّل دخول على claude.ai.")}}};let cb=()=>{};
  const fire=()=>cb({docs:Object.entries(L).map(([id,v])=>({id,data:()=>v}))});
  return{onSnapshot(f){cb=f;fire()},doc:id=>({set:async v=>{L[id]=v;save();fire()},delete:async()=>{delete L[id];save();fire()}})}
}
setTimeout(()=>{if(!loaded){loaded=true;render()}},10000);
(async()=>{
  try{
    let u=null;try{u=await claude.use("user");db=await claude.use("db");if(db&&u)col=db.collection("data/users/"+await u.id())}catch(_){}
    if(!col){db=1;col=localCol();note("⚠️ التعديلات بتتحفظ في المتصفح ده بس")}else note("✓ التعديلات بتتحفظ على حسابك")
    if(col)col.onSnapshot(s=>{
      if(!s.docs.some(d=>d.id==="_s")){if(s.metadata&&s.metadata.fromCache)return;D.forEach((x,k)=>col.doc("m"+String(k+1).padStart(2,"0")).set({n:x[0],i:x[1],d:x[2],t:x[3].split(" ")}));col.doc("_s").set({v:1});return}
      meals=s.docs.filter(d=>d.id!=="_s").map(d=>norm(d.id,d.data())).filter(m=>m.n).sort((a,b)=>a.id.localeCompare(b.id,undefined,{numeric:true}));
      loaded=true;cur=null;if(!document.activeElement||document.activeElement.tagName!=="INPUT"&&document.activeElement.tagName!=="TEXTAREA")render()},()=>{loaded=true;render()});
  }catch(_){}
  loaded=true;render();
})();
render();
</script>
